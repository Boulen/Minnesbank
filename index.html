<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<body>
<div class="wrap">
  <div id="login-screen" class="login-screen" style="display:block">
    <div style="font-size:52px;margin-bottom:20px">🤖</div>
    <div class="login-title">AI-Assistent</div>
    <div class="login-sub">Logga in med Google för att synka mellan enheter.</div>
    <button class="login-btn" onclick="startLogin()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Logga in med Google
    </button>
    <div id="debug-msg" style="margin-top:20px;font-size:11px;color:#5c5c5c;"></div>
  </div>
  <div id="main-app" style="display:none">
    <div class="hdr">
      <div class="hdr-info"><div class="hdr-title" id="htitle"></div></div>
      <div class="header-actions">
        <div class="tabs" style="-webkit-overflow-scrolling:touch;">
          <button class="tab on" data-v="aktivitet">Aktivitet</button>
          <button class="tab" data-v="funderingar"><span class="tab-short">Not...</span><span class="tab-full">Notering</span></button>
          <button class="tab" data-v="samtal"><span class="tab-short">Sam...</span><span class="tab-full">Samtal</span></button>
          <button class="tab" data-v="konversation"><span class="tab-short">Kon...</span><span class="tab-full">Konversation</span></button>
          <button class="tab" data-v="utvarderingar"><span class="tab-short">Betyg</span><span class="tab-full">Betyg</span></button>
          <button class="tab" data-v="ai"><span class="tab-short">AI</span><span class="tab-full">AI</span></button>
          <button class="tab" data-v="history">Historik</button>
        </div>
        <button type="button" id="syn-to-translate-btn" title="Gå till AI → Översättning" style="background:none;border:none;color:#5c5c5c;font-size:12px;cursor:pointer;padding:0 4px;flex-shrink:0">🌐</button>
        <button class="gear-btn" onclick="openInstallningarOverlay();" title="Inställningar">⚙</button>
      </div>
    </div>
    <div class="body" id="body"></div>
  </div>
  </div>
</div>

<div class="dict-bar">
  <div class="dict-result" id="dictResult"></div>
  <div class="dict-result" id="synResult"></div>
  <div id="dictCameraContainer" style="display:none;max-width:940px;margin:0 auto 10px;">
    <video id="dictCameraVideo" autoplay playsinline style="width:100%;border-radius:10px;max-height:220px;object-fit:cover;background:#000"></video>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button id="dictSnapBtn" type="button" class="action-btn" style="flex:1">📸 Ta foto</button>
      <button id="dictCloseCameraBtn" type="button" class="action-btn" style="color:var(--error)">✕</button>
    </div>
  </div>
  <canvas id="dictSnapCanvas" style="display:none"></canvas>
  <div class="dict-combined-row">
    <div class="dict-input-row dict-row-uploads">
      <label class="action-btn" style="cursor:pointer" title="Ladda upp bild eller fil">📁<input type="file" id="dictImgUpload" accept="image/*,.txt,.md,.csv,.json,text/plain" style="display:none"></label>
      <button class="action-btn" id="dictCameraBtn" type="button" title="Ta bild">📷</button>
    </div>
    <div class="dict-input-row dict-row-main">
      <input type="text" id="dictInput" placeholder="Sök">
      <button class="action-btn" id="dictSpellBtn" type="button" title="Stavningskontroll">🔤</button>
    </div>
    <div class="dict-input-row dict-row-small">
      <input type="text" id="synInput" placeholder="Ord">
    </div>
  </div>
</div>


<script src="js/core.js"></script>
<script src="js/drive.js"></script>
<script src="js/samtal.js"></script>
<script src="js/historik.js"></script>
<script src="js/aktivitet.js"></script>
<script src="js/notering.js"></script>
<script src="js/konversation.js"></script>
<script src="js/betyg.js"></script>
<script src="js/ai.js"></script>
<script src="js/installningar.js"></script>
<script>
init();
</script>
</body>
</html>
